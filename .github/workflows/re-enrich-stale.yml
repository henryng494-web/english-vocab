name: Re-enrich stale words

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Batch size per run
        required: false
        default: "25"
      offset:
        description: Stale-row offset
        required: false
        default: "0"
      word:
        description: Optional single word (e.g. draw)
        required: false
        default: ""

jobs:
  re-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Run stale re-enrich batch
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS="--limit=${{ inputs.limit }} --offset=${{ inputs.offset }}"
          if [ -n "${{ inputs.word }}" ]; then
            ARGS="--word=${{ inputs.word }}"
          fi
          npm run re-enrich:stale -- $ARGS
