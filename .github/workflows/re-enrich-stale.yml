name: Re-enrich stale words

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: Loop until all stale rows are fixed (recommended)
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      limit:
        description: Batch size per loop (when run_all=true) or single batch
        required: false
        default: "20"
      offset:
        description: Start offset (only when run_all=false)
        required: false
        default: "0"
      word:
        description: Optional single word (e.g. draw) — overrides run_all
        required: false
        default: ""

permissions:
  contents: read

jobs:
  re-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Re-enrich stale word_details (examples + meanings + register)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ inputs.word }}" ]; then
            npm run re-enrich:stale -- --word=${{ inputs.word }}
          elif [ "${{ inputs.run_all }}" = "true" ]; then
            npm run re-enrich:all -- --limit=${{ inputs.limit }}
          else
            npm run re-enrich:stale -- --limit=${{ inputs.limit }} --offset=${{ inputs.offset }}
          fi
